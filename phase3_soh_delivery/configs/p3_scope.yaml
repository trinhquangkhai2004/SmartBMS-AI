phase: P3
spec_version: '1.2'
status: GROUP_APPROVAL_REPORTED_PENDING_RECORD_DETAILS
source:
  dataset: RT-Batt
  version: 2
  doi: 10.17632/nsc7hnsg4s.2
  archive: our_data.zip
  domain: RT-Batt LFP/graphite at 30 C
prediction:
  unit: physical_cell
  output: SoH_percent
  measurement_basis: capacity
  inference_event_proposal: end_of_valid_charge
