  required_baseline: Ridge
  sanity_baseline: train_median
  research_comparator: XGBoost
evaluation:
  split_unit: physical_cell
  development_fraction: 0.75
  heldout_fraction: 0.25
  development_validation: GroupKFold
  development_fold_count: 5
  er5_acceptance_status: PENDING_REVIEWER_APPROVAL
integration:
  source_module: F3
  output_module: F5
  f2_q_model_policy: fixed_phase2_calibration
  f3_to_f5_scope_fields: [soh_percent, status, observed_at, model_version]
  f3_to_f2_capacity_feedback: false
  f3_to_f2_guard_test: P3-IT-02
  lishen_2s1p_validated: false
